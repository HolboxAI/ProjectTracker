<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Covex-Board</title>
<meta name="description" content="Sign in to Covex-Board: boards, sprints and backlogs for a small team.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f5f63'/%3E%3Cpath d='M4 5h8v1.6a1.4 1.4 0 0 0 0 2.8V11H4V9.4a1.4 1.4 0 0 0 0-2.8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/app.css">
<script>
  /* Same pre-paint theme resolution as the app shell -- the sign-in screen
     must not flash the light palette at someone who works in the dark. */
  (function () {
    var choice = 'system';
    try {
      var stored = localStorage.getItem('covex-theme');
      if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored;
    } catch (error) { /* storage blocked -- stay on system */ }
    var dark = choice === 'dark'
      || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-choice', choice);
  }());
</script>
</head>
<body class="auth-body">

<main class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4 5h8v1.6a1.4 1.4 0 0 0 0 2.8V11H4V9.4a1.4 1.4 0 0 0 0-2.8z"
              fill="currentColor"/>
      </svg>
    </span>
    <span class="auth-title">Covex-Board</span>
  </div>

  <p class="auth-lede">Sign in with your Holbox account or administrator credentials.</p>

  <div class="auth-sso" id="sso-container">
    <button class="btn btn-google" id="google-signin-btn" type="button">
      <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      <span id="google-btn-label">Continue with Google</span>
    </button>
  </div>

  <div class="auth-divider">
    <span>or with password</span>
  </div>

  <form class="auth-form" id="login-form" novalidate>
    <label class="field">
      <span class="field-label">Username</span>
      <input class="input" id="username" name="username" type="text"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required>
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </label>

    <p class="form-error" id="login-error" role="alert" hidden></p>

    <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
  </form>

  <p class="auth-foot">
    Sign in with your <span class="mono">@holbox.ai</span> or <span class="mono">@holbox.com</span> Google account.
    First-time sign-ins are provisioned automatically.
  </p>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
