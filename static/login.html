<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Covex-Board</title>
<meta name="description" content="Sign in to Covex-Board: boards, sprints and backlogs for a small team.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f5f63'/%3E%3Cpath d='M4 5h8v1.6a1.4 1.4 0 0 0 0 2.8V11H4V9.4a1.4 1.4 0 0 0 0-2.8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/app.css">
<script>
  /* Same pre-paint theme resolution as the app shell -- the sign-in screen
     must not flash the light palette at someone who works in the dark. */
  (function () {
    var choice = 'system';
    try {
      var stored = localStorage.getItem('covex-theme');
      if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored;
    } catch (error) { /* storage blocked -- stay on system */ }
    var dark = choice === 'dark'
      || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-choice', choice);
  }());
</script>
</head>
<body class="auth-body">

<main class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4 5h8v1.6a1.4 1.4 0 0 0 0 2.8V11H4V9.4a1.4 1.4 0 0 0 0-2.8z"
              fill="currentColor"/>
      </svg>
    </span>
    <span class="auth-title">Covex-Board</span>
  </div>

  <p class="auth-lede">Sign in with the account your administrator set up for you.</p>

  <form class="auth-form" id="login-form" novalidate>
    <label class="field">
      <span class="field-label">Username</span>
      <input class="input" id="username" name="username" type="text"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required>
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </label>

    <p class="form-error" id="login-error" role="alert" hidden></p>

    <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
  </form>

  <p class="auth-foot">
    Name and credentials are issued by an administrator.
    Google Workspace sign-in is coming for <span class="mono">@holbox.com</span> accounts.
  </p>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
