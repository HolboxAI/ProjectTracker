# Covex-Board behind nginx.
#
# Installed to /etc/nginx/sites-available/covex-tracker with __DOMAIN__ replaced.
# `certbot --nginx` then rewrites this file to add the TLS listener, the
# certificate paths and the HTTP-to-HTTPS redirect -- so what is here is the
# plain-HTTP origin only. If you edit it afterwards, keep the block certbot
# wrote or it will be overwritten on the next renewal.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The app takes JSON, not uploads; a small ceiling keeps an accidental
    # large body from being buffered on the instance.
    client_max_body_size 2m;

    # Nothing here should be cached by a shared proxy: the responses are
    # per-session and the app marks them no-store itself.
    # Firebase Custom Auth Domain proxy
    location /__/auth/ {
        proxy_pass https://projecttracker-17e6d.firebaseapp.com;
        proxy_set_header Host projecttracker-17e6d.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;

        # The app reads X-Forwarded-For for the lockout counter, and will only
        # trust it from loopback -- which is what this is. Without these two
        # lines every request looks like it came from nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A redirect from the app must arrive as a redirect, not be followed
        # here. This is the default, but stating it keeps it from being
        # "helpfully" changed later.
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
